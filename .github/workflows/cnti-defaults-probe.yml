name: CNTi cert on chart defaults (temporary)
on:
  push:
    branches: [defaults-v2.2.0]
permissions:
  contents: read
jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lfn-cnti/testsuite-action@05a9860905f31c6813f735d25e5cefd7c62a1e5a # v1.1.0
        with:
          version: v2.2.0
          cnf_config: cnti-testsuite.yaml
          tests: cert
          fail_on_failure: "false"
          artifact_name: results-${{ matrix.run }}
