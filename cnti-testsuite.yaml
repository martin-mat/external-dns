---
# CNTi Test Suite configuration for the external-dns chart in this
# repository.
config_version: "v2"
common:
  container_names:
    # Retained image tags used by the rolling update, downgrade and rollback
    # tests; the chart's appVersion is the tag under test.
    - name: external-dns
      rolling_update_test_tag: "v0.21.0"
      rolling_downgrade_test_tag: "v0.20.0"
      rolling_version_change_test_tag: "v0.21.0"
      rollback_from_tag: "v0.21.0"
deployments:
  helm_dirs:
    - name: external-dns
      helm_directory: charts/external-dns
      namespace: external-dns-cnti
      helm_values: --values ci/cnti-values.yaml
